# These clauses are documentary/technical limits, not enabled video findings.
# IDs are unique across the whole sources directory.
- clause_id: S231-p19.1
  document: &S231
    title: Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
    registry_code: V1900019680
    url: https://adilet.zan.kz/rus/docs/V1900019680
    edition_checked: 2026-06-30
    checked_at: 2026-10-17
    source_url: https://zan.gov.kz/api/documents/136659/rus
    source_version: 136659_815858; изменения №25 от 16.03.2026 и №78 от 30.06.2026 проверены отдельно
  locator: глава 2, параграф 2, пункт 19, подпункт 1
  quote: проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;
  verified_verbatim: true
  visual_test: По обычному видео можно видеть обращение к документу, но это не проверка личности.
  not_visual: Содержание удостоверения, данные цифровых документов и их соответствие клиенту; распознавание и идентификация лиц запрещены кейсом.
- clause_id: S231-p19.4
  document: *S231
  locator: глава 2, параграф 2, пункт 19, подпункт 4
  quote: сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег;
  verified_verbatim: true
  visual_test: Наблюдение пересчёта не устанавливает его арифметическую и документальную правильность.
  not_visual: Сумма наличных, номиналы каждого листа, сумма в документе и корректность их сопоставления.
- clause_id: S231-p31.2
  document: *S231
  locator: глава 2, параграф 3, пункт 31, подпункт 2
  quote: проверяет наличие подписи клиента и при участии операционного работника наличие его подписи, сверяет их с имеющимися образцами подписей;
  verified_verbatim: true
  visual_test: Можно отметить работу с документом; подпись на общем плане не проверяется.
  not_visual: Подлинность подписей, наличие требуемых подписей и сверка с образцами, включая электронные данные.
- clause_id: S231-p26
  document: *S231
  locator: глава 2, параграф 2, пункт 26, абзац первый
  quote: Наличные деньги, принятые от клиента в течение рабочего дня зачисляются на банковские счета клиентов в тот же рабочий день.
  verified_verbatim: true
  visual_test: Время передачи наличных в видеозаписи не показывает время бухгалтерской проводки.
  not_visual: Зачисление на счёт, время проводки и исполнение договора инкассации. Доступа к АБИС по кейсу нет.
- clause_id: S231-p74
  document:
    <<: *S231
    source_url: https://zan.gov.kz/api/documents/223567/rus
    source_version: 223567_815791; пункт 2, новая редакция пункта 74 с 12.07.2026
  locator: глава 2, параграф 8, пункт 74; новая редакция по постановлению №25 от 16.03.2026
  quote: Банки обеспечивают хранение наличных денег в кладовых и (или) сейфовой комнате после их учета в автоматизированной цифровой системе в соответствии с внутренними документами банка.
  verified_verbatim: true
  visual_test: Видимое помещение и перемещение денег не подтверждают предварительный учёт.
  not_visual: Отражение денег в цифровой системе, её записи, внутренние документы и полнота учёта. Сводный ответ ЭКБ содержит старое слово «информационной»; цитата взята непосредственно из акта изменения.
- clause_id: S231-p76
  document: *S231
  locator: глава 2, параграф 8, пункт 76
  quote: Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся у лиц, ответственных за сохранность наличных денег.
  verified_verbatim: true
  visual_test: Можно видеть передачу похожего на ключ предмета; его назначение и полномочия получателя не следуют из внешнего вида.
  not_visual: Код замка, происхождение ключа, назначение ответственного лица и действительное право хранения.
- clause_id: S231-p77
  document: *S231
  locator: глава 2, параграф 8, пункт 77
  quote: Наличные деньги в кладовой и (или) сейфовой комнате хранятся раздельно по виду валюты, по номиналам банкнот и монет в металлических шкафах, стеллажах, сейфах, тележках.
  verified_verbatim: true
  visual_test: Общий план может показать ёмкости хранения, но не полное содержимое и разделение по номиналам.
  not_visual: Валюта и номинал скрытых упаковок, полнота раздельного хранения. Цвет пачки не является достоверной маркировкой валюты.
- clause_id: S231-p78
  document: *S231
  locator: глава 2, параграф 8, пункт 78
  quote: проверяют соответствие фактического наличия в кладовой и (или) сейфовой комнате наличных денег остатку кассы и данным бухгалтерского учета.
  verified_verbatim: true
  visual_test: Пересчёт перед закрытием кладовой можно наблюдать, но он не доказывает сверку с учётом.
  not_visual: Остатки кассы, бухгалтерские данные, полнота наличия и результат сверки.
- clause_id: S231-p99
  document: *S231
  locator: глава 3, параграф 1, пункт 99, вводная часть и подпункты 1–2
  quote: "Допускается формировать бригаду инкассаторов из двух человек – инкассатора-сборщика и водителя-инкассатора в следующих случаях:"
  verified_verbatim: true
  visual_test: Количество людей в ограниченном кадре не устанавливает численность всей бригады.
  not_visual: Условия разрешённой бригады из двух человек — автомобильные видеокамеры с онлайн-просмотром и применение специальных кейсов/контейнеров; водитель и остальная бригада могут находиться вне кадра.
- clause_id: S14-p12
  document:
    title: Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
    act: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14
    registry_code: V2000020075
    url: https://adilet.zan.kz/rus/docs/V2000020075
    edition_checked: 2024-12-24
    checked_at: 2026-10-17
    source_url: https://zan.gov.kz/api/documents/139854/rus
    source_version: "139854_739849"
  locator: глава 3, пункт 12, подпункт 1
  quote: толщина железобетонной оболочки стен и потолка кладовой не менее 200 (двести) миллиметров;
  verified_verbatim: true
  visual_test: Из общего плана нельзя измерить скрытую железобетонную оболочку.
  not_visual: Толщина и материал стен/потолка, класс защиты двери и скрытые инженерные характеристики.
- clause_id: S21-2024-p3
  document:
    title: Инструкция по организации антитеррористической защиты расчетно-кассовых отделений банков второго уровня, уязвимых в террористическом отношении
    act: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 30 апреля 2024 года № 21
    registry_code: V2400034348
    url: https://adilet.zan.kz/rus/docs/V2400034348
    edition_checked: 2024-04-30
    checked_at: 2026-10-17
    source_url: https://zan.gov.kz/api/documents/196550/rus
    source_version: "196550_701371"
  locator: глава 1, пункт 3
  quote: распространяется на расчетно-кассовые отделения, рассчитанные на одновременное пребывание (вместимостью) 200 (двести) и более человек.
  verified_verbatim: true
  visual_test: Размер кадра с кассиром не определяет проектную вместимость отделения.
  not_visual: Применимость инструкции зависит от характеристик объекта; инструкция не используется как универсальный источник нарушений для любой записи кассы.
