# Temporary text of clauses 11, 13(3), 14 and 16 is explicitly valid until
# 2027-01-01. The catalogue must be rechecked before enabling later editions.
- clause_id: S14-p8
  document: &S14
    title: Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
    act: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14
    registry_code: V2000020075
    url: https://adilet.zan.kz/rus/docs/V2000020075
    edition_checked: 2024-12-24
    checked_at: 2026-10-17
    source_url: https://zan.gov.kz/api/documents/139854/rus
    source_version: "139854_739849"
  locator: глава 3, пункт 8
  quote: Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом.
  verified_verbatim: true
  visual_test: При полном обзоре планировки можно проверить видимое отделение кассового узла. Пункт описывает устройство помещения.
  not_visual: Наличие полномочий на вход не определяется по видео. Открытая в момент прохода дверь сама по себе не нарушает требование о закрывающемся входе.
- clause_id: S14-p16.1
  document: *S14
  locator: глава 3, пункт 16, подпункт 1; временная редакция до 01.01.2027
  quote: каждая касса имеет отдельный вход с закрывающейся на замок дверью;
  verified_verbatim: true
  visual_test: Наличие отдельного входа и двери относится к проверке устройства установленного помещения кассы, если они целиком различимы.
  not_visual: Исправность и фактическое запирание замка, полномочия входящего и иной вход вне кадра. Это не основание классифицировать любого второго человека как постороннего.
- clause_id: S14-p16.4
  document: *S14
  locator: глава 3, пункт 16, подпункт 4; временная редакция до 01.01.2027
  quote: передняя часть кассы оборудуется специальными транспортирующими устройствами для передачи наличных денег и ценностей.
  verified_verbatim: true
  visual_test: Наличие транспортирующего устройства можно показать, если передняя часть кассы полностью видна.
  not_visual: Нельзя вывести отсутствие устройства из неудачного ракурса; исправность механизма и соответствие защитным требованиям требуют дополнительной проверки. Пункт не формулирует отдельный запрет на каждый жест передачи вне лотка.
- clause_id: S14-p16.6
  document: *S14
  locator: глава 3, пункт 16, подпункт 6; временная редакция до 01.01.2027
  quote: касса оборудуется видеокамерами системы видеонаблюдения;
  verified_verbatim: true
  visual_test: Различимая камера подтверждает только наличие видимого устройства. Собственная анализируемая запись не является проверкой всей системы видеонаблюдения.
  not_visual: Работоспособность, охват всех зон, срок хранения, доступ к архиву и надёжность системы по одному фрагменту не устанавливаются.
- clause_id: S14-p20
  document: *S14
  locator: глава 3, пункт 20, вводная часть
  quote: "Для осуществления операции по инкассации банкнот, монет и ценностей необходимо наличие следующих помещений:"
  verified_verbatim: true
  visual_test: Общая планировка может быть контекстом ручной проверки состава помещений. Короткая запись одного рабочего места не покрывает этот пункт.
  not_visual: Наличие всего комплекса помещений, их назначение и взаимное расположение вне кадра. Не создавать нарушение из отсутствия видимой оружейной комнаты на записи кассы.
- clause_id: S14-p21
  document: *S14
  locator: глава 3, пункт 21, абзац второй
  quote: При устройстве бокса или погрузочно-разгрузочной площадки обеспечивается ограничение доступа и просмотра третьими лицами за осуществлением инкассации банкнот, монет и ценностей.
  verified_verbatim: true
  visual_test: Только установленная погрузочно-разгрузочная площадка или бокс дают применимый контекст для наблюдения доступа и обзора.
  not_visual: Статус третьего лица, полномочия, границы всей площадки и возможности обзора вне кадра. Пункт не переносится на обычное кассовое окно.
