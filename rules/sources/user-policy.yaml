  visual_test: Не менее трёх различимых физических людей одновременно, с подтверждением в последовательных кадрах. Новый клиент с новым номером трека не считается третьим человеком, если в кадре одновременно остаются только двое.
  not_visual: Отражения, тёмные силуэты, сильно перекрытые или неразличимые за стеклом фигуры исключаются. Полномочия и принадлежность к персоналу не определяются этим критерием.
