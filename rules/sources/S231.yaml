# Official EKB quotations, checked 2026-10-17. The consolidated EKB file is
# 136659_815858; amendments No.25 (2026-03-16) and No.78 (2026-06-30) were read
# separately. No.78 changes points 51 and 53-1, not the clauses quoted below.
# A verified quotation does not by itself make a visual rule applicable.
- clause_id: S231-p12
  document: &S231
    title: Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    act: Постановление Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
    registry_code: V1900019680
    url: https://adilet.zan.kz/rus/docs/V1900019680
    edition_checked: 2026-06-30
    checked_at: 2026-10-17
    source_url: https://zan.gov.kz/api/documents/136659/rus
    source_version: 136659_815858; изменения №25 от 16.03.2026 и №78 от 30.06.2026 проверены отдельно
  locator: глава 2, параграф 1, пункт 12, абзац первый
  quote: Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка.
  verified_verbatim: true
  visual_test: Наблюдаемое хранение опознаваемой личной вещи работника внутри установленной зоны кассового узла. Одна детекция сумки, прямоугольного предмета или телефона не устанавливает назначение вещи.
  not_visual: Принадлежность вещи, внутренний порядок хранения, рабочее назначение предмета и свойства неразличимого устройства. Лекарства и медицинские изделия прямо разрешены абзацем вторым.
- clause_id: S231-p12-exceptions
  document: *S231
  locator: глава 2, параграф 1, пункт 12, абзац второй
  quote: Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации.
  verified_verbatim: true
  visual_test: Явно распознанный смартфон у кассового работника внутри кассового узла даёт признак для проверки применимости исключения. Формулировка должна называть наблюдаемое средство связи и не утверждать подтверждённую функцию камеры. Различимый объектив или видимое использование камеры усиливают основание.
  not_visual: Функция камеры не следует из одного класса phone. Не утверждаем факт съёмки, содержание устройства и отсутствие разрешения по похожему силуэту.
- clause_id: S231-p20
  document: *S231
  locator: глава 2, параграф 2, пункт 20, абзац первый
  quote: Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.
  verified_verbatim: true
  visual_test: Непрерывно наблюдается передача денег от конкретного клиента кассиру и их пересчёт в рамках этого приёма после видимого ухода клиента. Вся зона возможного присутствия клиента и действия рук должны быть видны.
  not_visual: Деньги в руках без клиента могут относиться к внутренней операции. Пустое окно, начало записи после передачи или отсутствие детекции человека не доказывают отсутствие клиента.
- clause_id: S231-p20-storage
  document: *S231
  locator: глава 2, параграф 2, пункт 20, абзац второй, второе предложение
  quote: Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
  verified_verbatim: true
  visual_test: Видна принадлежность наличных завершённому приёму и их дальнейшее хранение на открытом столе, например при начале обслуживания следующего клиента. Нужна непрерывная цепочка событий, а не отдельный кадр с деньгами.
  not_visual: Предназначение текущей суммы, момент завершения операции, состояние запирания вне обзора. Слово «закрывающихся» не позволяет утверждать по кадру, что замок открыт или устройство неисправно.
- clause_id: S231-p22
  document: *S231
  locator: глава 2, параграф 2, пункт 22
  quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
  verified_verbatim: true
  visual_test: На записи видны начало обслуживания конкретного клиента и выход кассира с рабочего места, пока обслуживание продолжается. Сидящий или стоящий рядом человек сам по себе не означает активное обслуживание.
  not_visual: Причина отсутствия, окончание обслуживания до начала фрагмента и пребывание кассира за перекрытием. Пропавший трек не равен уходу.
- clause_id: S231-p24
  document: *S231
  locator: глава 2, параграф 2, пункт 24, подпункт 3
  quote: 3) проверяет целостность сумки;
  verified_verbatim: true
  visual_test: При наблюдаемом приёме инкассаторской сумки можно показать её осмотр. Отсутствие различимого жеста осмотра не доказывает, что проверка не выполнена.
  not_visual: Полнота проверки пломбы, правильность документа и соответствие его сведений сумке по общему плану не определяются.
- clause_id: S231-p25
  document: *S231
  locator: глава 2, параграф 2, пункт 25, абзац первый
  quote: В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности.
  verified_verbatim: true
  visual_test: Установлены инкассаторский приём, видимое повреждение целостности сумки до вскрытия и вскрытие с пересчётом при видимом отсутствии инкассатора в полностью наблюдаемой зоне. Без признака повреждения это правило неприменимо.
  not_visual: Не предполагаем нарушение целостности у любой сумки; не считаем штатное вскрытие целой сумки после ухода инкассатора нарушением этого пункта.
- clause_id: S231-p31
  document: *S231
  locator: глава 2, параграф 3, пункт 31, подпункт 4
  quote: пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;
  verified_verbatim: true
  visual_test: Полностью видна последовательность подготовки, пересчёта и выдачи конкретной суммы клиенту. Для замечания нужно установить выдачу без пересчёта в присутствии клиента, учитывая возможный повторный пересчёт.
  not_visual: Подготовительный пересчёт до прихода клиента допустим как наблюдение и не доказывает пропуск обязательного пересчёта при выдаче. По обрезанному фрагменту отсутствие действия не устанавливается.
- clause_id: S231-p35
  document: *S231
  locator: глава 2, параграф 3, пункт 35, первое предложение
  quote: Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или в помещении для пересчета наличных денег клиентами в присутствии кассового работника или контролирующего работника.
  verified_verbatim: true
  visual_test: Видимая последовательность выдачи клиенту и последующего пересчёта может служить контекстом. Уход клиента из кадра не исключает пересчёт в предусмотренном помещении.
  not_visual: Неизвестное помещение вне кадра, предъявление претензий, суммы, недостача и последующие действия клиента. Автоматическое обвинение кассира из ухода клиента не следует.
- clause_id: S231-p38
  document: *S231
  locator: глава 2, параграф 3, пункт 38
  quote: Кассовые операции по выдаче наличных денег клиента подразделениям инкассации банка или инкассаторской организации осуществляется кассовым работником на основании препроводительного документа, соответствующего требованиям пункта 106 Правил.
  verified_verbatim: true
  visual_test: Передача денег инкассатору даёт контекст операции, но не подтверждает документальное основание.
  not_visual: Наличие, содержание, подлинность и соответствие препроводительного документа по обычному плану видеонаблюдения не проверяются.
- clause_id: S231-p39
  document: *S231
  locator: глава 2, параграф 3, пункт 39
  quote: Работник подразделения инкассации банка или инкассаторской организации принимает наличные деньги в соответствии с пунктом 107 Правил.
  verified_verbatim: true
  visual_test: Приём инкассатором можно связать с наблюдаемым осмотром сумки; применимость зависит от установленного типа передачи.
  not_visual: Должность по одежде, реквизиты явочной карточки, пломбы и препроводительного документа не считаются проверенными.
- clause_id: S231-p42
  document: *S231
  locator: глава 2, параграф 4, пункт 42
  quote: Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту.
  verified_verbatim: true
  visual_test: Установлена операция пересчёта, сортировки или упаковки вне приёма/выдачи клиенту и полностью видна зона, в которой может присутствовать контролирующий работник. Отдельная комната не является условием самого пункта.
  not_visual: Не выводим нарушение из одиночного кассира при обслуживании клиента. Нельзя установить должность присутствующего человека по одежде или отсутствие контролёра вне поля зрения.
- clause_id: S231-p75
  document: *S231
  locator: глава 2, параграф 8, пункт 75
  quote: Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег.
  verified_verbatim: true
  visual_test: Можно отметить вход человека и видимое сопровождение в установленную кладовую или сейфовую комнату. Это наблюдение, а не автоматическое заключение о постороннем.
  not_visual: Полномочия, распорядительный документ и назначение ответственных лиц невидимы. Пункт не устанавливает запрет на любого второго человека на стороне кассира.
- clause_id: S231-p105
  document: *S231
  locator: глава 3, параграф 2, пункт 105
  quote: Банкноты, монеты и ценности, подлежащие инкассации, упаковываются в сумки с составлением препроводительного документа.
  verified_verbatim: true
  visual_test: Полная наблюдаемая передача ценностей для инкассации позволяет проверить видимую упаковку. Слово «сумка» включает специальные мешки, кейсы, кассеты и контейнеры.
  not_visual: Назначение передачи, содержимое закрытого приспособления и составление документа не определяются только его внешним видом.
- clause_id: S231-p107
  document: *S231
  locator: глава 3, параграф 2, пункт 107, вводная часть
  quote: "Прием банкнот, монет и ценностей от клиентов осуществляется инкассатором-сборщиком, который проверяет:"
  verified_verbatim: true
  visual_test: Контекст приёма инкассатором и осмотр упаковки могут быть показаны как наблюдения. Подпункты требуют целостности сумки, правильности пломбирования, карточки и документа.
  not_visual: Невидимый или короткий осмотр не означает его отсутствие; тождественность оттиска образцу и правильность реквизитов не проверяются.
- clause_id: S231-p112
  document: *S231
  locator: глава 3, параграф 3, пункт 112, абзац второй
  quote: Пачки банкнот и мешки с монетами и ценностями, имеющие дефекты упаковки и оформления, обнаруженные бригадой работников подразделения инкассации банка, инкассаторской организации при их проверке, не принимаются.
  verified_verbatim: true
  visual_test: Только видимые повреждения упаковки при установленной перевозке и последующий приём этой же упаковки позволяют поставить предметный вопрос проверяющему.
  not_visual: Скрытые дефекты, факт их обнаружения работником, оформление накладок и тождественность пломб. Мятая обычная сумка не тождественна дефектной пачке банкнот.
- clause_id: S231-p113
  document: *S231
  locator: глава 3, параграф 3, пункт 113, абзац первый
  quote: После проверки банкнот, монет и ценностей бригада работников подразделения инкассации банка, инкассаторской организации упаковывает  их в сумки при присутствии клиента-отправителя.
  verified_verbatim: true
  visual_test: Установлена межтерриториальная перевозка по параграфу 3, видна упаковка бригадой и вся зона присутствия клиента-отправителя. Не переносить требование на любое вскрытие или упаковку у кассира.
  not_visual: Назначение перевозки, договорённость сторон, полномочия представителя клиента и правильность документа не видны по общему плану.
