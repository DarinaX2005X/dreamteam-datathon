    source_version: Сценарий кейса; самостоятельным нормативным актом не является
  locator: Инкассаторская сумка на столе после ухода сотрудника
  verified_verbatim: false
  visual_test: До ухода видна инкассаторская сумка на рабочем столе. Сотрудник проходит к выходу из помещения; та же сумка остаётся на столе, рядом нет другого видимого физического сотрудника. Все условия подтверждены в общих последовательных кадрах.
  not_visual: Содержимое закрытой сумки, действующий порядок хранения и возможная передача ответственности за кадром. Сумка сама по себе, обычная работа с соседним сейфом и исчезновение рамки человека не устанавливают этот сценарий.
