[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lado-local"
version = "0.1.0"
description = "Local video evidence review for cash operations"
requires-python = ">=3.10"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "httpx>=0.28,<1", "Pillow>=11,<14"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "PyYAML>=6,<7"]
runtime = [
  "numpy==1.26.4",
  "Pillow==12.3.0",
  "av==13.1.0",
  "supervision==0.29.1",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.6",
  "safetensors==0.5.3",
  "tokenizers==0.22.2",
  "huggingface-hub==0.36.2",
]
cpu = ["onnxruntime==1.23.2"]
cuda = ["onnxruntime-gpu==1.23.2"]
pose = ["rtmlib==0.0.16"]
adapters = ["peft==0.17.1", "accelerate==1.10.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["navidu*"]

[tool.setuptools.package-data]
"navidu.service" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
