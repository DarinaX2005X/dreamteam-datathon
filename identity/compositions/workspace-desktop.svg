<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="t d">
  <title id="t">Дизайн-образец: разбор проверки, 1440×960</title>
  <desc id="d">Образец рабочей поверхности, не скриншот готового продукта. Сверху вердикт и действие «Лист проверки». Слева тёмная сцена: кадр записи с разметкой, открытое уточнение роли, управление воспроизведением и лента фактов с эпизодами. Справа список эпизодов: выбранный эпизод раскрыт, в нём кадры, наблюдение, требование, норма и решение проверяющего.</desc>
  <defs>
    <filter id="wdRest" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4A0221" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4A0221" flood-opacity="0.10"/>
    </filter>
    <filter id="wdOverlay" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E0711" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1E0711" flood-opacity="0.38"/>
    </filter>
    <clipPath id="wdVideo"><rect x="102" y="182" width="800" height="450" rx="12"/></clipPath>
    <clipPath id="wdT1"><rect x="1028" y="300" width="112" height="63" rx="8"/></clipPath>
    <clipPath id="wdT2"><rect x="1150" y="300" width="112" height="63" rx="8"/></clipPath>
    <clipPath id="wdT3"><rect x="1272" y="300" width="112" height="63" rx="8"/></clipPath>
  </defs>

  <rect width="1440" height="960" fill="#FCFAFB"/>

  <!-- панель приложения: 64px -->
  <rect width="1440" height="64" fill="#FFFFFF"/>
  <rect y="63" width="1440" height="1" fill="#E1D5DB"/>
  <image href="../logo/navidu-logo.svg" x="24" y="18" width="123" height="28"/>
  <g font-family="Open Sans, sans-serif" font-size="14" font-weight="600">
    <text x="180" y="38" fill="#6B5761">Проверки</text>
    <text x="252" y="38" fill="#8A7580">/</text>
    <text x="266" y="38" fill="#2A0A18">kassa_0412.mov</text>
    <text x="1162" y="38" fill="#A31551">Нормы</text>
    <rect x="1240" y="12" width="176" height="40" rx="10" fill="#A31551"/>
    <text x="1328" y="37" fill="#FFFFFF" text-anchor="middle">Новая проверка</text>
  </g>

  <!-- вердикт -->
  <path d="M30.4 96h19.2a2.2 2.2 0 0 1 1.7 3.6l-9.6 11.4a2.2 2.2 0 0 1-3.4 0l-9.6-11.4a2.2 2.2 0 0 1 1.7-3.6z" fill="#FC9385" stroke="#4A0221" stroke-width="1.6"/>
  <g font-family="Open Sans, sans-serif">
    <text x="64" y="112" font-size="22" font-weight="700" fill="#2A0A18">Обнаружены признаки возможных нарушений</text>
    <text x="64" y="140" font-size="14" fill="#6B5761">2 эпизода. Запись 02:05, проверено 7 правил. На участке 01:12–01:20 стол не виден, там правила о деньгах не проверялись.</text>
    <rect x="1268" y="92" width="148" height="40" rx="10" fill="#FFFFFF" stroke="#A31551" stroke-width="1.5"/>
    <text x="1342" y="117" font-size="14" font-weight="600" fill="#A31551" text-anchor="middle">Лист проверки</text>
  </g>

  <!-- сцена -->
  <rect x="24" y="166" width="956" height="782" rx="20" fill="#2A0B19"/>
  <image href="../art/desk-scene.svg" x="102" y="182" width="800" height="450" clip-path="url(#wdVideo)"/>

  <!-- уточнение роли: всплывающая панель над кадром -->
  <path d="M388 532l12 -10v20z" fill="#FFFFFF"/>
  <g filter="url(#wdOverlay)"><rect x="132" y="432" width="256" height="196" rx="14" fill="#FFFFFF"/></g>
  <g font-family="Open Sans, sans-serif">
    <text x="150" y="460" font-size="14" font-weight="700" fill="#2A0A18">Кто это на записи?</text>
    <text x="150" y="480" font-size="12.5" fill="#6B5761">Роль определена по положению</text>
    <rect x="144" y="492" width="232" height="30" rx="8" fill="#FBF0F4" stroke="#A31551" stroke-width="1.5"/>
    <circle cx="162" cy="507" r="6" fill="#A31551"/><circle cx="162" cy="507" r="2.4" fill="#FFFFFF"/>
    <text x="176" y="512" font-size="13.5" font-weight="600" fill="#2A0A18">Кассир</text>
    <circle cx="162" cy="539" r="6" fill="none" stroke="#8A7580" stroke-width="1.5"/>
    <text x="176" y="544" font-size="13.5" fill="#2A0A18">Клиент</text>
    <circle cx="272" cy="539" r="6" fill="none" stroke="#8A7580" stroke-width="1.5"/>
    <text x="286" y="544" font-size="13.5" fill="#2A0A18">Инкассатор</text>
    <circle cx="162" cy="567" r="6" fill="none" stroke="#8A7580" stroke-width="1.5"/>
    <text x="176" y="572" font-size="13.5" fill="#2A0A18">Сотрудник</text>
    <circle cx="272" cy="567" r="6" fill="none" stroke="#8A7580" stroke-width="1.5"/>
    <text x="286" y="572" font-size="13.5" fill="#2A0A18">Посторонний</text>
    <rect x="144" y="586" width="232" height="32" rx="8" fill="#FBF0F4"/>
    <text x="260" y="607" font-size="13.5" font-weight="600" fill="#A31551" text-anchor="middle">Пересчитать по нормам</text>
  </g>

  <!-- управление воспроизведением -->
  <g font-family="Open Sans, sans-serif">
    <circle cx="122" cy="664" r="20" fill="#3A1225"/>
    <path d="M116 654v20l16-10z" fill="#F7EDF1"/>
    <text x="156" y="670" font-size="15" font-weight="700" fill="#F7EDF1" font-stretch="87.5%">00:44,2</text>
    <text x="222" y="670" font-size="15" font-weight="600" fill="#CDB6C1" font-stretch="87.5%">/ 02:05</text>
    <rect x="300" y="648" width="92" height="32" rx="8" fill="#3A1225"/>
    <text x="346" y="669" font-size="13" font-weight="600" fill="#F7EDF1" text-anchor="middle">Кадр назад</text>
    <rect x="400" y="648" width="100" height="32" rx="8" fill="#3A1225"/>
    <text x="450" y="669" font-size="13" font-weight="600" fill="#F7EDF1" text-anchor="middle">Кадр вперёд</text>
    <rect x="770" y="648" width="132" height="32" rx="16" fill="#4D1C33" stroke="#61CFFF" stroke-width="1.5"/>
    <path d="M786 664l5 5 9-10" fill="none" stroke="#61CFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="810" y="669" font-size="13" font-weight="600" fill="#F7EDF1">Разметка</text>
  </g>

  <!-- лента фактов: 924×241 -->
  <image href="../art/fact-strip.svg" x="40" y="696" width="924" height="241"/>

  <!-- колонка эпизодов -->
  <g font-family="Open Sans, sans-serif">
    <text x="1004" y="188" font-size="17" font-weight="700" fill="#2A0A18">Эпизоды</text>
    <rect x="1084" y="172" width="26" height="22" rx="6" fill="#F6DCE6"/>
    <text x="1097" y="188" font-size="13" font-weight="700" fill="#85103F" text-anchor="middle">2</text>
  </g>

  <!-- эпизод 1: выбран и раскрыт -->
  <g filter="url(#wdRest)"><rect x="1004" y="204" width="412" height="548" rx="14" fill="#FFFFFF"/></g>
  <rect x="1005" y="205" width="410" height="546" rx="13" fill="none" stroke="#A31551" stroke-width="2"/>
  <path d="M1026.6 226h14.8a1.8 1.8 0 0 1 1.4 2.9l-7.4 8.8a1.8 1.8 0 0 1-2.8 0l-7.4-8.8a1.8 1.8 0 0 1 1.4-2.9z" fill="#FC9385" stroke="#4A0221" stroke-width="1.5"/>
  <g font-family="Open Sans, sans-serif">
    <text x="1052" y="240" font-size="16" font-weight="700" fill="#2A0A18">Пересчёт денег без клиента у кассы</text>
    <rect x="1028" y="254" width="72" height="24" rx="6" fill="#FC9385"/>
    <text x="1064" y="271" font-size="14" font-weight="700" fill="#4A0221" text-anchor="middle" font-stretch="87.5%">00:44,2</text>
    <text x="1112" y="271" font-size="13" font-weight="600" fill="#6B5761" font-stretch="87.5%">фрагмент 00:41,5–00:47,5</text>
  </g>
  <!-- кадры-доказательства -->
  <image href="../art/desk-scene.svg" x="1028" y="300" width="112" height="63" clip-path="url(#wdT1)"/>
  <image href="../art/desk-scene.svg" x="1150" y="300" width="112" height="63" clip-path="url(#wdT2)" opacity="0.92"/>
  <image href="../art/desk-scene.svg" x="1272" y="300" width="112" height="63" clip-path="url(#wdT3)" opacity="0.92"/>
  <rect x="1027" y="299" width="114" height="65" rx="9" fill="none" stroke="#FC9385" stroke-width="2.5"/>
  <g font-family="Open Sans, sans-serif" font-size="12.5" font-weight="600" fill="#6B5761" font-stretch="87.5%">
    <text x="1028" y="382" fill="#2A0A18">00:44,2</text><text x="1150" y="382">00:42,0</text><text x="1272" y="382">00:47,1</text>
  </g>
  <g font-family="Open Sans, sans-serif">
    <text x="1028" y="414" font-size="13" font-weight="700" fill="#6B5761">Что видно</text>
    <text font-size="14" fill="#2A0A18"><tspan x="1028" y="436">Кассир держит пачку денег 6 с. Клиента</tspan><tspan x="1028" y="456">у окна нет с 00:38,4. В 00:47,5 деньги</tspan><tspan x="1028" y="476">убраны в ящик.</tspan></text>
    <text x="1028" y="508" font-size="13" font-weight="700" fill="#6B5761">Почему это может быть нарушением</text>
    <text font-size="14" fill="#2A0A18"><tspan x="1028" y="530">Наличные принимаются и пересчитываются</tspan><tspan x="1028" y="550">кассовым работником в присутствии клиента.</tspan></text>
    <text x="1028" y="582" font-size="13" font-weight="700" fill="#6B5761">Норма</text>
    <text font-size="13" font-weight="600" fill="#A31551"><tspan x="1028" y="602">Правила осуществления кассовых операций,</tspan><tspan x="1028" y="620">пост. Правления НБРК от 29.11.2019 № 231, п. 20</tspan></text>
  </g>
  <!-- решение проверяющего -->
  <g font-family="Open Sans, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <rect x="1028" y="640" width="118" height="40" rx="10" fill="#FFFFFF" stroke="#8A7580" stroke-width="1"/>
    <text x="1087" y="665" fill="#2A0A18">Подтвердить</text>
    <rect x="1152" y="640" width="122" height="40" rx="10" fill="#FFFFFF" stroke="#8A7580" stroke-width="1"/>
    <text x="1213" y="665" fill="#2A0A18">Не нарушение</text>
    <rect x="1280" y="640" width="112" height="40" rx="10" fill="#FFFFFF" stroke="#8A7580" stroke-width="1"/>
    <text x="1336" y="665" fill="#2A0A18">Не видно</text>
  </g>
  <rect x="1028" y="692" width="364" height="40" rx="10" fill="#F7F2F4" stroke="#E1D5DB"/>
  <text x="1042" y="717" font-family="Open Sans, sans-serif" font-size="13.5" fill="#6B5761">Заметка проверяющего</text>

  <!-- эпизод 2: свёрнут -->
  <g filter="url(#wdRest)"><rect x="1004" y="768" width="412" height="76" rx="14" fill="#FFFFFF"/></g>
  <path d="M1026.6 788h14.8a1.8 1.8 0 0 1 1.4 2.9l-7.4 8.8a1.8 1.8 0 0 1-2.8 0l-7.4-8.8a1.8 1.8 0 0 1 1.4-2.9z" fill="none" stroke="#A3382A" stroke-width="1.8"/>
  <g font-family="Open Sans, sans-serif">
    <text x="1052" y="802" font-size="15" font-weight="700" fill="#2A0A18">Кассир покинул рабочее место</text>
    <text x="1052" y="826" font-size="13" fill="#6B5761">во время обслуживания</text>
    <rect x="1318" y="786" width="74" height="24" rx="6" fill="#FFE7E2"/>
    <text x="1355" y="803" font-size="14" font-weight="700" fill="#A3382A" text-anchor="middle" font-stretch="87.5%">01:39,6</text>
  </g>

  <!-- проверено без замечаний -->
  <rect x="1004" y="860" width="412" height="76" rx="14" fill="#F7F2F4"/>
  <g font-family="Open Sans, sans-serif">
    <text x="1024" y="892" font-size="14" font-weight="700" fill="#2A0A18">Без замечаний: 5 правил</text>
    <text x="1024" y="916" font-size="13" fill="#6B5761">Одно из них нельзя проверить на 01:12–01:20</text>
    <path d="M1384 892l-6 6-6-6" fill="none" stroke="#52414A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
