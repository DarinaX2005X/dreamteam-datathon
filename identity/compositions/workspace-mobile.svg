<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d">
  <title id="t">Дизайн-образец: разбор проверки, 390×844</title>
  <desc id="d">Узкая рабочая поверхность. Порядок: вердикт, видео с управлением, свёрнутая лента фактов, выбранный эпизод с кадром, наблюдением, нормой и решением, ниже следующий эпизод. Все действия широкой версии сохранены.</desc>
