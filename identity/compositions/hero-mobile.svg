<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d">
  <title id="t">Дизайн-образец: первый экран лендинга, 390×844</title>
  <desc id="d">Узкая композиция: сообщение и основное действие идут первыми, сцена упрощена до кадра кассы и карточки эпизода, лента фактов на первом экране не показывается.</desc>
  <defs>
    <radialGradient id="hmField" cx="0.1" cy="0" r="1">
      <stop offset="0" stop-color="#F6DCE6"/><stop offset="0.5" stop-color="#FBF0F4"/><stop offset="1" stop-color="#FCFAFB"/>
    </radialGradient>
    <linearGradient id="hmCta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B21C5C"/><stop offset="1" stop-color="#A31551"/></linearGradient>
    <filter id="hmLift" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A0221" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#4A0221" flood-opacity="0.20"/>
    </filter>
    <filter id="hmCtaShadow" x="-10%" y="-30%" width="120%" height="190%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4A0221" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#A31551" flood-opacity="0.34"/>
    </filter>
    <clipPath id="hmClip"><rect x="24" y="466" width="342" height="192" rx="14"/></clipPath>
  </defs>
  <rect width="390" height="844" fill="#FCFAFB"/>
  <rect width="390" height="844" fill="url(#hmField)"/>

  <image href="../logo/navidu-logo.svg" x="16" y="16" width="123" height="28"/>

  <g font-family="Open Sans, sans-serif" fill="#2A0A18">
    <text x="16" y="116" font-size="35" font-weight="800" letter-spacing="-0.6">Смотрите главное,</text>
    <text x="16" y="156" font-size="35" font-weight="800" letter-spacing="-0.6">а не всю запись</text>
    <text font-size="16" font-weight="400" fill="#52414A">
      <tspan x="16" y="200">Навиду находит на записи кассы</tspan>
      <tspan x="16" y="224">моменты, похожие на нарушение</tspan>
      <tspan x="16" y="248">кассовой дисциплины, и для каждого</tspan>
      <tspan x="16" y="272">показывает кадр, время и пункт</tspan>
      <tspan x="16" y="296">нормативного акта РК.</tspan>
    </text>
  </g>

  <g filter="url(#hmCtaShadow)"><rect x="16" y="324" width="358" height="52" rx="12" fill="url(#hmCta)"/></g>
  <g font-family="Open Sans, sans-serif" font-weight="700" text-anchor="middle">
    <text x="195" y="356" font-size="17" fill="#FFFFFF">Открыть дашборд</text>
    <text x="195" y="410" font-size="16" fill="#A31551">Презентация проекта</text>
  </g>
  <rect x="112" y="416" width="166" height="1.5" fill="#A31551" opacity="0.45"/>

  <rect x="16" y="450" width="358" height="224" rx="22" fill="#2A0B19"/>
  <image href="../art/desk-scene.svg" x="24" y="466" width="342" height="192" clip-path="url(#hmClip)"/>

  <g filter="url(#hmLift)"><rect x="32" y="632" width="326" height="152" rx="14" fill="#FFFFFF"/></g>
  <path d="M52.6 653h12.8a1.6 1.6 0 0 1 1.2 2.6l-6.4 7.6a1.6 1.6 0 0 1-2.4 0l-6.4-7.6a1.6 1.6 0 0 1 1.2-2.6z" fill="#FC9385" stroke="#4A0221" stroke-width="1.4"/>
  <g font-family="Open Sans, sans-serif">
    <text x="74" y="665" font-size="15" font-weight="700" fill="#2A0A18">Пересчёт без клиента у кассы</text>
    <rect x="52" y="678" width="68" height="22" rx="6" fill="#FC9385"/>
    <text x="86" y="694" font-size="13" font-weight="700" fill="#4A0221" text-anchor="middle" font-stretch="87.5%">00:44,2</text>
    <text x="130" y="694" font-size="13" font-weight="600" fill="#6B5761">длится 6 с</text>
    <text x="52" y="726" font-size="14" fill="#2A0A18">Кассир держит деньги, клиента нет.</text>
    <text x="52" y="760" font-size="12.5" font-weight="600" fill="#A31551">Правила кассовых операций № 231, п. 20</text>
  </g>
  <text x="195" y="816" font-family="Open Sans, sans-serif" font-size="12.5" font-weight="600" fill="#6B5761" text-anchor="middle">Иллюстрация эпизода из отчёта проверки</text>
</svg>
